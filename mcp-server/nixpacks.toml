[phases.setup]
nixPkgs = ["nodejs_22", "bun"]

[phases.install]
cmds = ["bun install"]

# Build step kept as a type-check sanity gate. Runtime does NOT depend on
# dist/ — we execute the TypeScript source directly via Bun.
[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run server-http.ts"
