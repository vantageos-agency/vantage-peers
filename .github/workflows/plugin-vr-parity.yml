name: Plugin <-> VantageRegistry parity gate

# A workflow that does not run and a workflow that passes look identical on the
# checks page: neither shows a red cross. Day 131 measured that: `push` was pinned
# to `main`, so on a branch with no open PR only the grep gate ever fired, and an
# ABSENCE of verdict was read as a verdict. Branch protection (task
# k17cnkxkm8xaz6d5tq1nxtxjtx8agq84) makes the absence BLOCK instead of being invisible.
#
# ONE TRIGGER PER CONTEXT (task k1702xbh01aamqv11b3rjf2vp98cpjb4). `pull_request`
# (target `main`) is the ONLY trigger for a PR -- same-repo and fork alike -- so every
# PR produces EXACTLY ONE run of this required context, one that actually executes.
# `push` (target `main`) covers the post-merge commit on main. There is deliberately
# NO per-job fork `if:` guard: a job-level skip reports to branch protection as a
# PASSING context that measured nothing (three-state verdict, etage 2, on the path
# every merge takes) and it lands LAST -- the exact race that a fork-only guard plus
# push:["**"] created, where each required context had a second reporter. Removing the
# second trigger removes the second reporter. Fork PRs are checked by their own
# pull_request run and remain Pi-gated at merge.
#
# DEGRADE-ON-FORK (task k1702xbh01aamqv11b3rjf2vp98cpjb4). GitHub withholds
# repository secrets from fork PRs by construction, so the halves of this job
# split by what a secret they cannot see:
#   - OFFLINE half (test_source_prose_identity_guard.py) — self-provides a
#     fictive vocabulary in-test, needs no secret and no network. It runs FOR
#     REAL on a fork: a fork that breaks the guard MECHANISM fails here, red.
#   - SECRET half (test_leak_guard.py resolves the real client vocabulary;
#     source_prose_identity_guard.py scans the real perimeter files; VR parity
#     needs the registry token) — cannot run on a fork. Rather than ERROR red
#     forever (a fork PR would then be unmergeable and INDISTINGUISHABLE from a
#     real leak), it emits a written, visible "REFUSING TO JUDGE" line naming
#     exactly what did not run, and exits 0. That is NOT a silent green: the
#     merge gate is a maintainer same-repo re-run citation (Pi refuses merge
#     without it; where the fork diff touches no plugin source, that fact is the
#     citation). A skip is honest only when WRITTEN DOWN and gated — mirroring
#     the leak guard's own CHECKED ∪ SKIPPED-with-a-reason = 100% inventory rule.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: plugin-vr-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-vr-parity:
    name: pytest tests/plugin/ (packaged plugin sources vs VR canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The leak guard measures NEW internal identifiers against origin/main:
          # a token already public there is tracked, a new one fails the build.
          # The default checkout is SHALLOW — origin/main does not exist in it —
          # so the guard cannot read its baseline and (correctly) refuses to
          # judge a diff against a baseline it cannot see.
          #
          # This line is not a workaround for that refusal, it is its other half.
          # A guard that punishes without providing the means to comply gets
          # ripped out, and then it guards nothing. The commit that makes the
          # guard fail loudly is the commit that must hand it the baseline.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      # OFFLINE HALF — real on every runner, forks included. The source-prose
      # mechanism suite builds its fictive vocabulary in-test (monkeypatch +
      # tmp_path) and asserts BOTH poles (a fictive identity IS caught in a
      # comment/description; benign text is NOT), needing no secret and no
      # network. A fork PR that breaks the guard MECHANISM fails here, for real.
      - name: "Offline mechanism suite (fictive vocabulary — real on forks)"
        run: pytest tests/plugin/test_source_prose_identity_guard.py -v

      # SECRET HALF — the three checks that resolve the REAL client vocabulary
      # (VANTAGE_CLIENT_HASHES) or reach VantageRegistry (VANTAGE_REGISTRY_TOKEN),
      # both withheld from fork PRs by GitHub. On a same-repo push/PR the secrets
      # are present and all three run under SECRECY > PARITY ordering (leak guard
      # first, no network; then the real-perimeter source-prose scan; then the
      # network VR parity gate). On a fork the secret is absent: rather than let
      # test_leak_guard.py ERROR red forever (its skipif does NOT fire when
      # NEITHER plaintext NOR hashes resolve, so the fixture raises), the step
      # DEFERS with a written, visible REFUSING TO JUDGE line naming exactly what
      # did not run — never a silent green. Merge is gated on a maintainer
      # same-repo re-run citation (see the DEGRADE-ON-FORK header block).
      - name: "Secret-gated real-perimeter checks (leak guard + source-prose + VR parity)"
        env:
          # Salted-hash vocabulary only -- the plaintext host config never leaves
          # the operator's machine (scripts/client_identity_config.py
          # resolve_vocabulary_or_fail). WE DO NOT TRANSPORT THE SECRET TO PROVE
          # WE DETECT IT. Scope of the real-perimeter scan: see the DECLARED SCOPE
          # block in scripts/source_prose_identity_guard.py.
          VANTAGE_CLIENT_HASHES: ${{ secrets.VANTAGE_CLIENT_HASHES }}
          VANTAGE_REGISTRY_TOKEN: ${{ secrets.VANTAGE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VANTAGE_CLIENT_HASHES:-}" ]; then
            echo "::warning title=Secret-gated half DEFERRED (fork PR — secrets withheld by GitHub)::REFUSING TO JUDGE — not a pass. A maintainer same-repo re-run before merge is the gate."
            echo "REFUSING TO JUDGE: VANTAGE_CLIENT_HASHES is unavailable to this fork PR, so the following ran on NO runner and are DEFERRED:"
            echo "  - tests/plugin/test_leak_guard.py        (needs the resolved client vocabulary to synthesize real leak material)"
            echo "  - scripts/source_prose_identity_guard.py (scans the REAL auth-profile perimeter files; needs the vocabulary)"
            echo "  - tests/plugin/test_vr_parity.py         (needs VANTAGE_REGISTRY_TOKEN to reach VantageRegistry)"
            echo ""
            echo "The OFFLINE mechanism half above DID run for real on this fork."
            echo "Merge gate (task k1702xbh01aamqv11b3rjf2vp98cpjb4): Pi refuses merge until a maintainer cites a same-repo run"
            echo "of this job (secrets present) on this fork head. Where the fork diff touches NO plugin source, that fact is the citation."
            exit 0
          fi
          # SECRECY > PARITY: a packaged/perimeter file carrying client identifiers
          # is a live disclosure in a PUBLIC package and must fail even if VR is down.
          pytest tests/plugin/test_leak_guard.py -v
          python3 scripts/source_prose_identity_guard.py
          pytest tests/plugin/test_vr_parity.py -v
