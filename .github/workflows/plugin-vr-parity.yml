name: Plugin <-> VantageRegistry parity gate

# A workflow that does not run and a workflow that passes look identical on the
# checks page: neither shows a red cross. Day 131 measured that: `push` was pinned
# to `main`, so on a branch with no open PR only the grep gate ever fired, and an
# ABSENCE of verdict was read as a verdict. Triggering on every branch is half the
# cure; the other half is branch protection (task k17cnkxkm8xaz6d5tq1nxtxjtx8agq84),
# which makes the absence BLOCK instead of merely being invisible.
#
# `pull_request` is deliberately gone: with `branches: ["**"]` every same-repo PR is
# already covered by its push, and keeping both fired two identical runs per commit.
# Fork PRs are consequently unchecked — they are not part of the fleet flow, where
# every merge is Pi-gated.
on:
  push:
    branches: ["**"]

concurrency:
  group: plugin-vr-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-vr-parity:
    name: pytest tests/plugin/ (packaged plugin sources vs VR canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The leak guard measures NEW internal identifiers against origin/main:
          # a token already public there is tracked, a new one fails the build.
          # The default checkout is SHALLOW — origin/main does not exist in it —
          # so the guard cannot read its baseline and (correctly) refuses to
          # judge a diff against a baseline it cannot see.
          #
          # This line is not a workaround for that refusal, it is its other half.
          # A guard that punishes without providing the means to comply gets
          # ripped out, and then it guards nothing. The commit that makes the
          # guard fail loudly is the commit that must hand it the baseline.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      # SECRECY > PARITY. The leak guard runs FIRST and needs no network: a
      # packaged file carrying client/person identifiers is a live disclosure
      # in a PUBLIC package, and must fail the build even if VR is down.
      - name: Leak guard (no client/person identifiers in the public package)
        env:
          # Salted-hash vocabulary only -- the plaintext host config never
          # leaves the operator's machine. See scripts/emit_client_hashes.py
          # and scripts/client_identity_config.py (resolve_vocabulary_or_fail)
          # for the full rationale: WE DO NOT TRANSPORT THE SECRET TO PROVE
          # WE DETECT IT.
          VANTAGE_CLIENT_HASHES: ${{ secrets.VANTAGE_CLIENT_HASHES }}
        run: pytest tests/plugin/test_leak_guard.py -v

      - name: VR parity gate (with secrecy-suspension)
        env:
          VANTAGE_REGISTRY_TOKEN: ${{ secrets.VANTAGE_REGISTRY_TOKEN }}
        run: pytest tests/plugin/test_vr_parity.py -v
