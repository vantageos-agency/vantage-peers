name: Vitest convex unit suite

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  vitest-convex:
    name: vitest run (convex unit suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run vitest unit suite (convex/ only)
        # Scope to convex/ subset (521/521 green): mcp-server is NOT a bun
        # workspace, so root `bun install --frozen-lockfile` doesn't install
        # mcp-server deps → `bun run test` fails 39 suites on
        # "Cannot find package '@vantageos/cloud-identity'". Eta REVISE iter 1
        # recommended Option B (scope convex/) + follow-up to wire mcp-server
        # deps as proper workspace (separate task).
        # vitest's non-zero exit on unhandled rejections (Convex
        # "Write outside of transaction" — fix-pattern m97cahtjf) still
        # surfaces as CI red even when "N passed" is shown.
        # The Railway PROD e2e mcp-crud spec stays separate (mcp-crud-baseline.yml).
        run: npx vitest run convex/
