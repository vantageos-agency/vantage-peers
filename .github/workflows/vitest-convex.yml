name: Vitest convex + mcp-server unit suite

# A workflow that does not run and a workflow that passes look identical on the
# checks page: neither shows a red cross. Day 131 measured that: `push` was pinned
# to `main`, so on a branch with no open PR only the grep gate ever fired, and an
# ABSENCE of verdict was read as a verdict. Branch protection (task
# k17cnkxkm8xaz6d5tq1nxtxjtx8agq84) makes the absence BLOCK instead of being invisible.
#
# ONE TRIGGER PER CONTEXT (task k1702xbh01aamqv11b3rjf2vp98cpjb4). `pull_request`
# (target `main`) is the ONLY trigger for a PR -- same-repo and fork alike -- so every
# PR produces EXACTLY ONE run of this required context, one that actually executes.
# `push` (target `main`) covers the post-merge commit on main. There is deliberately
# NO per-job fork `if:` guard: a job-level skip reports to branch protection as a
# PASSING context that measured nothing (three-state verdict, etage 2, on the path
# every merge takes) and it lands LAST -- the exact race that a fork-only guard plus
# push:["**"] created, where each required context had a second reporter. Removing the
# second trigger removes the second reporter. Fork PRs are checked by their own
# pull_request run and remain Pi-gated at merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: vitest-convex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-convex:
    name: vitest run (convex + mcp-server unit suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run vitest unit suite (convex/ + mcp-server/test/ + mcp-server/src/__tests__/)
        # Day 107: mcp-server now wired as a bun workspace in root
        # package.json (task k1748t5s, PR follow-up to #872). Root
        # `bun install --frozen-lockfile` pulls @vantageos/cloud-identity
        # + @vantageos/mosaic so mcp-server suites resolve their imports
        # in CI. Three-scope run covers both test dirs (the 18-file
        # src/__tests__/ subtree includes chatgpt-tool-annotations.test.ts
        # — the #872 anchor — and is NOT picked up by the bare
        # `mcp-server/test/` glob, per Eta REVISE iter 1 on #879).
        # vitest's non-zero exit on unhandled rejections (Convex
        # "Write outside of transaction" — fix-pattern m97cahtjf) still
        # surfaces as CI red even when "N passed" is shown.
        # The Railway PROD e2e mcp-crud spec stays separate (mcp-crud-baseline.yml).
        run: npx vitest run convex/ mcp-server/test/ mcp-server/src/__tests__/
