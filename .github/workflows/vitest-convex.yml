name: Vitest convex unit suite

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  vitest-convex:
    name: vitest run (convex + mcp-server unit suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run vitest unit suite
        # Run via bun so vitest's non-zero exit on unhandled rejections
        # (Convex "Write outside of transaction" — fix-pattern m97cahtjf)
        # surfaces as CI red even when "N passed" is shown.
        # The Railway PROD e2e mcp-crud spec stays separate (mcp-crud-baseline.yml).
        run: bun run test
