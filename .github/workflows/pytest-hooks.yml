name: Pytest hooks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest-hooks:
    name: pytest tests/hooks/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run hook tests
        run: pytest tests/hooks/ -v
