name: Brand Grep Gate

# A workflow that does not run and a workflow that passes look identical on the
# checks page: neither shows a red cross. Day 131 measured that: `push` was pinned
# to `main`, so on a branch with no open PR only the grep gate ever fired, and an
# ABSENCE of verdict was read as a verdict. Branch protection (task
# k17cnkxkm8xaz6d5tq1nxtxjtx8agq84) makes the absence BLOCK instead of being invisible.
#
# ONE TRIGGER PER CONTEXT (task k1702xbh01aamqv11b3rjf2vp98cpjb4). `pull_request`
# (target `main`) is the ONLY trigger for a PR -- same-repo and fork alike -- so every
# PR produces EXACTLY ONE run of this required context, one that actually executes.
# `push` (target `main`) covers the post-merge commit on main. There is deliberately
# NO per-job fork `if:` guard: a job-level skip reports to branch protection as a
# PASSING context that measured nothing (three-state verdict, etage 2, on the path
# every merge takes) and it lands LAST -- the exact race that a fork-only guard plus
# push:["**"] created, where each required context had a second reporter. Removing the
# second trigger removes the second reporter. Fork PRs are checked by their own
# pull_request run and remain Pi-gated at merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: grep-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-legacy-brand-refs:
    name: "No legacy brand refs in src/ or docs/"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Fail if claude-peers appears in mcp-server/src/"
        run: |
          if grep -rn "claude-peers" mcp-server/src/; then
            echo "ERROR: legacy 'claude-peers' reference found in mcp-server/src/"
            echo "Replace with 'VantagePeers' — see C4 cleanup (mission k57a36y8w5t085bqr23dsmvb2d882506, task k1714377ewx12y2mefymayfh358830h4)"
            exit 1
          fi
          echo "PASS: mcp-server/src/ is clean"

      - name: "Fail if claude-peers appears in convex/ (excluding node_modules)"
        run: |
          if grep -rn "claude-peers" convex/; then
            echo "ERROR: legacy 'claude-peers' reference found in convex/"
            exit 1
          fi
          echo "PASS: convex/ is clean"

      - name: "Fail if claude-peers appears in docs/why-vantagepeers.md"
        run: |
          if grep -n "claude-peers" docs/why-vantagepeers.md; then
            echo "ERROR: legacy 'claude-peers' reference found in docs/why-vantagepeers.md"
            exit 1
          fi
          echo "PASS: docs/why-vantagepeers.md is clean"

      - name: "Fail if claude-peers appears in mcp-server/server.ts"
        run: |
          if grep -n "claude-peers" mcp-server/server.ts 2>/dev/null; then
            echo "ERROR: legacy 'claude-peers' reference found in mcp-server/server.ts"
            exit 1
          fi
          echo "PASS: mcp-server/server.ts is clean"

  no-buffer-in-v8-convex:
    name: "No Buffer global in non-use-node convex/*.ts (Day-101 root-fix k1706c5jf)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Fail if Buffer.(from|concat|byteLength|alloc) appears in V8-runtime convex/*.ts"
        run: |
          set -e
          VIOLATIONS=""
          for file in $(find convex -maxdepth 2 -name '*.ts' -not -path '*/_generated/*' -not -path '*/__tests__/*' 2>/dev/null); do
            if head -10 "$file" | grep -qE '^\s*"use node"\s*;?'; then
              continue
            fi
            # Match Buffer.* but skip lines that are pure comments (// or * leading) and lines with explicit override marker.
            MATCHES=$(grep -nE '\bBuffer\.(from|concat|byteLength|alloc)\b' "$file" | grep -vE '^\s*[0-9]+:\s*(//|\*)' | grep -v 'allow-buffer-in-v8' || true)
            if [ -n "$MATCHES" ]; then
              VIOLATIONS="${VIOLATIONS}\n${file}:\n${MATCHES}"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Buffer used in V8-runtime convex/*.ts files (no 'use node' directive)"
            echo "Buffer is a Node.js global — absent from Convex V8 isolate. Use btoa/atob or TextEncoder/TextDecoder."
            printf "%b\n" "$VIOLATIONS"
            echo "Reference: PR #1026 (Buffer→btoa/atob V8 cursor codec, 18d /dashboard outage)"
            echo "Override (rare): add '// allow-buffer-in-v8: <reason>' inline on the offending line"
            exit 1
          fi
          echo "PASS: no Buffer in V8-runtime convex/*.ts (Day-101 root-fix gate green)"
