name: Auto-publish to npm on version bump

on:
  push:
    branches:
      - main
    paths:
      - "mcp-server/package.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          PREV_VERSION=$(git show HEAD~1:mcp-server/package.json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
          CURR_VERSION=$(python3 -c "import json; print(json.load(open('mcp-server/package.json'))['version'])")

          echo "prev=$PREV_VERSION"
          echo "curr=$CURR_VERSION"
          echo "prev_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "curr_version=$CURR_VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$PREV_VERSION" ] || [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $PREV_VERSION → $CURR_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($CURR_VERSION) — skipping publish."
          fi

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        working-directory: mcp-server
        run: npm ci

      - name: Build
        if: steps.version.outputs.changed == 'true'
        working-directory: mcp-server
        run: npm run build

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --provenance=false: npm provenance requires id-token write permission
        # and a specific npm registry config; disabled here per known issue.
        # --access public: required for scoped-or-unscoped public packages.
        run: npm publish --provenance=false --access public

      - name: Tag git release
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.curr_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.curr_version }}"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes \
            --latest
