name: Check generated Convex bindings

# convex/_generated/api.d.ts is a committed artifact regenerated by
# `npx convex codegen`. It drifted stale twice in one commit (Day 133
# analysis): the CLI's inline verbose component-types form was superseded
# by a compact `ComponentApi<...>` import form, and a new module
# (okfBundleDurable) was added to convex/ without re-running codegen. Both
# classes of drift are silent at review time — the file still typechecks
# against the OLD component shape, it just no longer matches what the
# current CLI would emit.
#
# `npx convex codegen` needs a live deployment (CONVEX_DEPLOY_KEY): it
# downloads current deployment state and uploads functions before writing
# bindings — confirmed by running it with no CONVEX_DEPLOYMENT set (fails
# immediately with "No CONVEX_DEPLOYMENT set") and by watching it hit the
# network ("Downloading current deployment state" / "Uploading functions
# to Convex") even with a bogus HTTP(S)_PROXY set. So the full drift check
# below is gated on a repo secret (CONVEX_DEPLOY_KEY_DEV) and provisioning
# that secret is a prerequisite for this job to run the full check instead
# of skipping it.
#
# LIMITATION: the full check is a soft-skip (not a hard fail) when the
# secret is absent, so it cannot block merges by itself until the secret
# is provisioned. The module-coverage step below runs unconditionally
# (no secret, no network) and catches the MISSING-module class of drift
# (e.g. okfBundleDurable) on every push regardless of secret provisioning.
on:
  push:
    branches: ["**"]

concurrency:
  group: check-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-generated:
    name: convex codegen drift + module-coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Module-coverage guard (no deployment needed)
        # Every Convex module file under convex/, INCLUDING nested ones
        # (convex/lib/*.ts, convex/migrations/*.ts, convex/_helpers/*.ts),
        # must have a matching `import type * as <id> from "../<path>.js"`
        # line in api.d.ts. Codegen indexes every module it finds
        # recursively (it does not care whether the file "looks like a
        # helper"), so this glob MUST stay recursive and MUST stay in sync
        # with what `npx convex codegen` actually emits — verify against
        # api.d.ts directly if the exclusion list below is ever touched,
        # never guess from file naming conventions.
        #
        # Exclusions verified against the current convex/_generated/api.d.ts
        # (checked by grepping actual import lines, not assumed):
        #   - *.test.ts / *.spec.ts: test files, never imported by api.d.ts.
        #   - schema.ts, auth.config.ts, convex.config.ts: config-only
        #     modules with no exported Convex functions; confirmed absent
        #     from api.d.ts's import list.
        #   - http.ts, crons.ts ARE regular modules with entries in
        #     api.d.ts (`import type * as http ...`, `... as crons ...`)
        #     and are therefore NOT excluded — they must keep matching.
        #
        # The api.d.ts identifier for a nested file replaces "/" with "_"
        # (e.g. convex/lib/auth.ts -> lib_auth), but the import PATH string
        # keeps the "/" (`"../lib/auth.js"`), so this check greps on the
        # path, which is stable regardless of any local identifier
        # renaming codegen applies to avoid name collisions (e.g.
        # convex/components.ts is aliased to `components_` in api.d.ts but
        # its import path is still "../components.js").
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            rel="${f#convex/}"
            rel="${rel%.ts}"
            base="$(basename "$rel")"
            case "$base" in
              *.test|*.spec) continue ;;
            esac
            case "$rel" in
              schema|auth.config|convex.config) continue ;;
            esac
            if ! grep -qF "\"../${rel}.js\"" convex/_generated/api.d.ts; then
              echo "::error::convex/${rel}.ts has no matching entry in convex/_generated/api.d.ts — run 'npx convex codegen' and commit the result"
              missing=1
            fi
          done < <(find convex -name '*.ts' -not -path 'convex/_generated/*')
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All Convex modules (recursive, including nested lib/migrations/_helpers) have a matching api.d.ts entry."

      - name: Full codegen drift check (requires CONVEX_DEPLOY_KEY_DEV)
        if: ${{ secrets.CONVEX_DEPLOY_KEY_DEV != '' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: npx convex codegen && git diff --exit-code convex/_generated

      - name: Full codegen drift check skipped (no secret provisioned)
        if: ${{ secrets.CONVEX_DEPLOY_KEY_DEV == '' }}
        run: |
          echo "::warning::CONVEX_DEPLOY_KEY_DEV secret not set — skipping full 'npx convex codegen && git diff' drift check. Only the module-coverage guard ran. Provision the secret to close this gap (see workflow header comment)."
