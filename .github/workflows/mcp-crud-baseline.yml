name: MCP CRUD Baseline Smoke Matrix

# ─────────────────────────────────────────────────────────────────────────────
# CRUD-T3 — VantagePeers MCP PROD Railway smoke matrix
#
# Triggers:
#   1. repository_dispatch event type "railway-deploy-success"
#      → Wire Railway deploy notification → GitHub via Sigma's Railway webhook
#        pointing at https://api.github.com/repos/<org>/<repo>/dispatches
#        with event_type: "railway-deploy-success".
#   2. workflow_dispatch — manual trigger from the Actions tab.
#   3. schedule cron every 15 min — catch deploys not covered by webhook.
#
# Required secrets (set in GH repo Settings → Secrets → Actions):
#   VP_MCP_PROD_URL       — PROD Railway MCP endpoint, e.g.
#                           https://vantage-peers-production.up.railway.app/mcp
#   VP_MCP_BEARER_TOKEN   — Master bearer token for the Railway HTTP transport
#   VP_MCP_FLEET_BEARER   — (Optional) separate fleet-alert bearer; falls back
#                           to VP_MCP_BEARER_TOKEN when absent
#   VP_MCP_AGENT_CREDENTIAL — the acting station's own agent credential; the
#                           master bearer is refused without it (#1420)
#   A run missing any required secret FAILS, naming it — never a skip-as-pass.
# ─────────────────────────────────────────────────────────────────────────────

on:
  repository_dispatch:
    types: [railway-deploy-success]

  workflow_dispatch:

  schedule:
    # Every 15 minutes — fallback so no deploy is undetected for more than 15 min
    - cron: "*/15 * * * *"

jobs:
  smoke:
    name: CRUD baseline smoke (25-cell matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (repo root)
        run: bun install --frozen-lockfile

      # A run without its PROD secrets measures nothing: the spec skips all 25
      # cells, and a skip must never be reported as a pass. In CI the absence is
      # a refusal that names each missing secret (task k179dxe91pmdh0qw669s23qh8s8fja60).
      # A local run without credentials still skips, by design of the spec.
      - name: Refuse when PROD secrets are absent
        env:
          VP_MCP_PROD_URL: ${{ secrets.VP_MCP_PROD_URL }}
          VP_MCP_BEARER_TOKEN: ${{ secrets.VP_MCP_BEARER_TOKEN }}
          VP_MCP_AGENT_CREDENTIAL: ${{ secrets.VP_MCP_AGENT_CREDENTIAL }}
        run: |
          missing=""
          for name in VP_MCP_PROD_URL VP_MCP_BEARER_TOKEN VP_MCP_AGENT_CREDENTIAL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::CRUD baseline cannot measure PROD — repository secret(s) not set:$missing"
            exit 1
          fi

      - name: Run CRUD baseline smoke matrix
        id: smoke
        # Write ops (op-D create + op-E get): enabled on deploy-dispatch + manual
        # triggers, disabled on the */15 cron schedule. Rationale: briefingNotes
        # and episodes have no delete tool in the registry yet — 96 scheduled
        # runs/day × 2 inert rows = 192/day accumulating in PROD namespace
        # audit/crud-smoke. Gating to deploy moments keeps full write-path
        # coverage where it matters (post-deploy correctness) with zero steady
        # pollution.
        env:
          VP_MCP_PROD_URL: ${{ secrets.VP_MCP_PROD_URL }}
          VP_MCP_BEARER_TOKEN: ${{ secrets.VP_MCP_BEARER_TOKEN }}
          VP_MCP_AGENT_CREDENTIAL: ${{ secrets.VP_MCP_AGENT_CREDENTIAL }}
          CRUD_SMOKE_WRITE_OPS: ${{ github.event_name == 'schedule' && 'off' || 'on' }}
        run: bun run test:e2e:mcp-crud

      - name: Alert fleet on failure
        if: failure()
        env:
          VP_MCP_PROD_URL: ${{ secrets.VP_MCP_PROD_URL }}
          VP_MCP_FLEET_BEARER: ${{ secrets.VP_MCP_FLEET_BEARER || secrets.VP_MCP_BEARER_TOKEN }}
          VP_MCP_AGENT_CREDENTIAL: ${{ secrets.VP_MCP_AGENT_CREDENTIAL }}
        run: |
          # Extract first failing test name + error from the vitest output.
          # GH Actions captures stdout; we truncate to 200 chars as per spec.
          FAILING_SUMMARY="${{ steps.smoke.outputs.summary || 'CRUD baseline smoke suite failed — see GH Actions run for details' }}"
          ALERT_CONTENT="[ALERT] CRUD-T3 smoke matrix FAILED on Railway PROD — branch: ${{ github.ref_name }}, run: ${{ github.run_id }}. ${FAILING_SUMMARY:0:200}"

          # Post DM to Pi
          # MCP Streamable-HTTP transport returns the session id in the
          # response HEADER `Mcp-Session-Id`, NOT the JSON body.
          # Use -D - to dump response headers to stdout, then extract the header.
          INIT_HEADERS_AND_BODY=$(curl -s -D - -X POST "${VP_MCP_PROD_URL%/mcp}/mcp" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${VP_MCP_FLEET_BEARER}" \
            ${VP_MCP_AGENT_CREDENTIAL:+-H "x-vantage-agent-credential: ${VP_MCP_AGENT_CREDENTIAL}"} \
            -d "{
              \"jsonrpc\": \"2.0\",
              \"id\": 1,
              \"method\": \"initialize\",
              \"params\": {
                \"protocolVersion\": \"2024-11-05\",
                \"capabilities\": {},
                \"clientInfo\": { \"name\": \"gh-actions-alert\", \"version\": \"1.0\" }
              }
            }") || true

          # HTTP/2 lower-cases headers; handle both cases with case-insensitive grep.
          SESSION_ID=$(echo "${INIT_HEADERS_AND_BODY}" | grep -i '^mcp-session-id:' | sed 's/^[Mm][Cc][Pp]-[Ss][Ee][Ss][Ss][Ii][Oo][Nn]-[Ii][Dd]:[[:space:]]*//' | tr -d '\r\n' || echo "")

          curl -s -X POST "${VP_MCP_PROD_URL%/mcp}/mcp" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${VP_MCP_FLEET_BEARER}" \
            ${VP_MCP_AGENT_CREDENTIAL:+-H "x-vantage-agent-credential: ${VP_MCP_AGENT_CREDENTIAL}"} \
            ${SESSION_ID:+-H "mcp-session-id: ${SESSION_ID}"} \
            -d "{
              \"jsonrpc\": \"2.0\",
              \"id\": 2,
              \"method\": \"tools/call\",
              \"params\": {
                \"name\": \"send_message\",
                \"arguments\": {
                  \"from\": \"sigma\",
                  \"channel\": \"pi\",
                  \"content\": $(echo "${ALERT_CONTENT}" | jq -Rs .)
                }
              }
            }" || echo "[alert] DM to pi failed — continuing"

          # Post DM to Sigma self-notification
          curl -s -X POST "${VP_MCP_PROD_URL%/mcp}/mcp" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${VP_MCP_FLEET_BEARER}" \
            ${VP_MCP_AGENT_CREDENTIAL:+-H "x-vantage-agent-credential: ${VP_MCP_AGENT_CREDENTIAL}"} \
            ${SESSION_ID:+-H "mcp-session-id: ${SESSION_ID}"} \
            -d "{
              \"jsonrpc\": \"2.0\",
              \"id\": 3,
              \"method\": \"tools/call\",
              \"params\": {
                \"name\": \"send_message\",
                \"arguments\": {
                  \"from\": \"sigma\",
                  \"channel\": \"sigma\",
                  \"content\": $(echo "${ALERT_CONTENT}" | jq -Rs .)
                }
              }
            }" || echo "[alert] DM to sigma failed — continuing"

          echo "Fleet alert dispatched."
          # Re-exit 1 so the job correctly shows as failed
          exit 1
