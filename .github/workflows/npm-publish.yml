name: Publish to npm

# Two trigger paths:
#   1. release.published — fires when a GitHub release is published. The release
#      body MUST contain `ETA_APPROVED_TASK_ID=k<32hex>` and
#      `ETA_APPROVED_COMMIT_SHA=<7-40 hex>` (one per line, case-insensitive keys).
#      Both tokens are extracted and feed the SAME verification steps as the
#      workflow_dispatch path — release.published is NOT a trusted bypass.
#   2. workflow_dispatch — manual path with Eta-approval inputs. Mirrors the
#      Day 82 npm publish protocol (ETA_APPROVED_TASK_ID + ETA_APPROVED_COMMIT_SHA)
#      so orchestrators can get OIDC --provenance attestation without publishing
#      from a local sandbox (which refuses --provenance with "Automatic provenance
#      generation not supported for provider: null").
#
# Validation order (BOTH paths):
#   a. checked-out SHA == resolved ETA_APPROVED_COMMIT_SHA (single source of truth)
#   b. Feature D HTTP action /api/eta/verify-publish-token verifies the VP task
#      exists, is closed by eta with [ETA-APPROVED] marker, is ≤60 min old,
#      and cites the same SHA. Same gate as the local enforce-eta-approval hook.
#   c. Only then build + publish.

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      eta_approved_task_id:
        description: 'VP task id closed by Eta with [ETA-APPROVED] marker (e.g. k177qvth538kvc8txt38zsdzzd88m7j8)'
        required: true
        type: string
      eta_approved_commit_sha:
        description: 'Git HEAD SHA at the time Eta issued the APPROVED verdict (must match workflow checkout)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout (workflow_dispatch — at the Eta-approved SHA)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.eta_approved_commit_sha }}

      - name: Checkout (release — at the release tag)
        if: github.event_name == 'release'
        uses: actions/checkout@v4

      - name: Extract Eta-approval tokens from release body (release only)
        id: extract_release_tokens
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -eu
          # Case-insensitive line-anchored regex match for the two tokens.
          TASK_ID=$(printf '%s\n' "$RELEASE_BODY" | grep -iEo '^[[:space:]]*ETA_APPROVED_TASK_ID[[:space:]]*=[[:space:]]*k[0-9a-f]{32}[[:space:]]*$' | head -n1 | sed -E 's/^[[:space:]]*[Ee][Tt][Aa]_[Aa][Pp][Pp][Rr][Oo][Vv][Ee][Dd]_[Tt][Aa][Ss][Kk]_[Ii][Dd][[:space:]]*=[[:space:]]*//' | tr -d '[:space:]' || true)
          SHA=$(printf '%s\n' "$RELEASE_BODY" | grep -iEo '^[[:space:]]*ETA_APPROVED_COMMIT_SHA[[:space:]]*=[[:space:]]*[0-9a-f]{7,40}[[:space:]]*$' | head -n1 | sed -E 's/^[[:space:]]*[Ee][Tt][Aa]_[Aa][Pp][Pp][Rr][Oo][Vv][Ee][Dd]_[Cc][Oo][Mm][Mm][Ii][Tt]_[Ss][Hh][Aa][[:space:]]*=[[:space:]]*//' | tr -d '[:space:]' || true)
          if [ -z "${TASK_ID:-}" ]; then
            echo "::error::Release body missing or malformed ETA_APPROVED_TASK_ID (expected line: ETA_APPROVED_TASK_ID=k<32hex>)."
            exit 1
          fi
          if [ -z "${SHA:-}" ]; then
            echo "::error::Release body missing or malformed ETA_APPROVED_COMMIT_SHA (expected line: ETA_APPROVED_COMMIT_SHA=<7-40 hex>)."
            exit 1
          fi
          echo "Extracted ETA_APPROVED_TASK_ID    : ${TASK_ID}"
          echo "Extracted ETA_APPROVED_COMMIT_SHA : ${SHA}"
          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve Eta-approval tokens (event-agnostic)
        id: resolve_tokens
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK_ID='${{ inputs.eta_approved_task_id }}'
            SHA='${{ inputs.eta_approved_commit_sha }}'
          else
            TASK_ID='${{ steps.extract_release_tokens.outputs.task_id }}'
            SHA='${{ steps.extract_release_tokens.outputs.sha }}'
          fi
          if [ -z "${TASK_ID}" ] || [ -z "${SHA}" ]; then
            echo "::error::Unresolved Eta-approval tokens (event=${{ github.event_name }})."
            exit 1
          fi
          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify checked-out SHA matches Eta-approved SHA
        env:
          EXPECTED_SHA: ${{ steps.resolve_tokens.outputs.sha }}
        run: |
          set -eu
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Actual HEAD     : ${ACTUAL_SHA}"
          echo "Eta APPROVED SHA: ${EXPECTED_SHA}"
          # For release path, the body SHA may be the 7-char short form. Accept
          # exact match OR prefix match (expected is a prefix of actual).
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ] && [ "${ACTUAL_SHA#${EXPECTED_SHA}}" = "${ACTUAL_SHA}" ]; then
            echo "::error::SHA mismatch — checkout resolved ${ACTUAL_SHA} but Eta approved ${EXPECTED_SHA}."
            exit 1
          fi
          echo "OK — SHA in lockstep with Eta verdict."

      - name: Verify Eta approval via VP HTTP action
        env:
          CONVEX_URL: https://compassionate-goldfinch-737.convex.cloud
          ETA_TASK: ${{ steps.resolve_tokens.outputs.task_id }}
          ETA_SHA: ${{ steps.resolve_tokens.outputs.sha }}
        run: |
          set -eu
          BODY=$(jq -nc --arg t "$ETA_TASK" --arg s "$ETA_SHA" '{taskId:$t, expectedSha:$s}')
          RESP=$(curl -sS -X POST "${CONVEX_URL}/api/eta/verify-publish-token" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "Response: $RESP"
          APPROVED=$(echo "$RESP" | jq -r '.approved // false')
          if [ "$APPROVED" != "true" ]; then
            REASON=$(echo "$RESP" | jq -r '.reason // "unknown"')
            echo "::error::Eta approval rejected by Feature D — reason: ${REASON}"
            exit 1
          fi
          echo "OK — Eta approval token valid."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Publish (with OIDC provenance attestation)
        working-directory: mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
