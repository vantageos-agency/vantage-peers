name: Backend-doctor ratchet

# A PR that adds a security site must fail before review (task
# k179600rsb4xsv7a975cjkqwhs8g7qhv). backend-doctor measures the six mechanical
# rule counts after a real install (without deps the package's tagged gates
# cannot be derived and the report carries FALLBACK); scripts/doctor-ratchet.mjs
# compares them to .backend-doctor/ratchet.json and refuses any rise, any
# uncertified count, any FALLBACK line, and a baseline raised above main's.
#
# Same trigger shape as typecheck.yml: one pull_request run per PR, one push run
# on main, no job-level skip (a skip reports as a passing required context).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: doctor-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: backend-doctor ratchet
    runs-on: ubuntu-latest
    env:
      DOCTOR_VERSION: "0.4.5"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run backend-doctor
        # Exit 1 means "violations found", which is expected while counts are
        # above zero; the ratchet decides. Exit 2 means the doctor could not judge.
        run: |
          set +e
          npx -y @vantageos/backend-doctor@${DOCTOR_VERSION} . --json-evidence doctor-evidence.json > doctor-report.txt 2>&1
          rc=$?
          set -e
          grep -E '^MECHANICAL RULE COUNTS' doctor-report.txt || true
          if [ "$rc" -eq 2 ]; then
            tail -40 doctor-report.txt
            echo "backend-doctor could not judge (exit 2)"
            exit 2
          fi

      - name: Previous baseline (main)
        run: |
          if git show origin/main:.backend-doctor/ratchet.json > ratchet-main.json 2>/dev/null; then
            echo "PREV_ARGS=--previous-baseline ratchet-main.json" >> "$GITHUB_ENV"
          else
            echo "no baseline on main yet (first delivery)"
          fi

      - name: Ratchet
        run: |
          node scripts/doctor-ratchet.mjs \
            --baseline .backend-doctor/ratchet.json \
            --evidence doctor-evidence.json \
            --report doctor-report.txt \
            ${PREV_ARGS:-}

      - name: Keep the doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-ratchet-report
          path: |
            doctor-report.txt
            doctor-evidence.json
